sources:
  - name: jaffle_shop
    database: raw  
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 1
          period: day
      loaded_at_field: _etl_loaded_at  
    tables:
      - name: orders
        columns:
          - name: id
            tests:
              - unique
              - not_null
              
      - name: customers
        columns:
          - name: id
            tests:
              - unique
              - not_null              
        freshness: null
        
